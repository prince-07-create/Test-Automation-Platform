name: Automated Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v5   # Updated to v5 to fix deprecation warning
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Install Playwright Browsers and OS Dependencies
      run: npx playwright install --with-deps   # Bypasses Maven to install safely

    - name: Create .env file for CI
      run: |
        echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" > .env
        echo "BASE_URL=https://the-internet.herokuapp.com" >> .env
        echo "API_URL=https://jsonplaceholder.typicode.com" >> .env
        echo "TEST_USERNAME=tomsmith" >> .env
        echo "TEST_PASSWORD=SuperSecretPassword!" >> .env

    - name: Run API and UI Tests
      run: mvn clean test

    - name: Upload HTML Report & Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          target/site/
          reports/screenshots/
        retention-days: 7
